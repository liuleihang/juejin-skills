    </filter>
    <path id="spark4Skills" d="M0 -1 Q0.13 -0.13 1 0 Q0.13 0.13 0 1 Q-0.13 0.13 -1 0 Q-0.13 -0.13 0 -1 Z"/>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgSkills)"/>

  <!-- 六边形容器 -->
  <path d="M 256 88 L 401.5 172 L 401.5 340 L 256 424 L 110.5 340 L 110.5 172 Z" fill="#FFFFFF" fill-opacity="0.05"/>
