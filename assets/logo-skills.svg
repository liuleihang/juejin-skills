  <use href="#spark4Skills" transform="translate(382 150) scale(34)" fill="url(#goldSkills)"/>

  <!-- 字样：仅 SKILLS（不含 juejin） -->
  <text x="256" y="478" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="50" letter-spacing="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round" paint-order="stroke" filter="url(#wordShadow)">SKILLS</text>
