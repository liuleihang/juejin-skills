  <g>
    <path d="M 280.47 286.84 L 361.53 325.16 Q 376.00 332.00 361.53 338.84 L 280.47 377.16 Q 266.00 384.00 251.53 377.16 L 170.47 338.84 Q 156.00 332.00 170.47 325.16 L 251.53 286.84 Q 266.00 280.00 280.47 286.84 Z" fill="#062E7A" fill-opacity="0.18"/>
    <path d="M 270.41 274.95 L 353.59 315.05 Q 368.00 322.00 353.59 328.95 L 270.41 369.05 Q 256.00 376.00 241.59 369.05 L 158.41 328.95 Q 144.00 322.00 158.41 315.05 L 241.59 274.95 Q 256.00 268.00 270.41 274.95 Z" fill="#FFFFFF" fill-opacity="0.60"/>
    <path d="M 270.41 210.95 L 353.59 251.05 Q 368.00 258.00 353.59 264.95 L 270.41 305.05 Q 256.00 312.00 241.59 305.05 L 158.41 264.95 Q 144.00 258.00 158.41 251.05 L 241.59 210.95 Q 256.00 204.00 270.41 210.95 Z" fill="#FFFFFF" fill-opacity="0.82"/>
    <path d="M 270.41 144.95 L 353.59 185.05 Q 368.00 192.00 353.59 198.95 L 270.41 239.05 Q 256.00 246.00 241.59 239.05 L 158.41 198.95 Q 144.00 192.00 158.41 185.05 L 241.59 144.95 Q 256.00 138.00 270.41 144.95 Z" fill="url(#plateTopSkills)"/>
