    <line x1="401.50" y1="192.00" x2="401.50" y2="320.00"/>
    <line x1="384.18" y1="350.00" x2="273.32" y2="414.00"/>
    <line x1="238.68" y1="414.00" x2="127.82" y2="350.00"/>
    <line x1="110.50" y1="320.00" x2="110.50" y2="192.00"/>
    <line x1="127.82" y1="162.00" x2="238.68" y2="98.00"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.34">
