    <circle cx="401.5" cy="172" r="7"/>
    <circle cx="401.5" cy="340" r="7"/>
    <circle cx="256" cy="424" r="7"/>
    <circle cx="110.5" cy="340" r="7"/>
    <circle cx="110.5" cy="172" r="7"/>
  </g>

