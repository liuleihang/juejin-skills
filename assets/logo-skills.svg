<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="skills">
  <defs>
    <linearGradient id="bgSkills" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA6FF"/>
      <stop offset="0.45" stop-color="#1E80FF"/>
      <stop offset="1" stop-color="#0B4FC4"/>
    </linearGradient>
    <linearGradient id="plateTopSkills" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
    <linearGradient id="goldSkills" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFF4CC"/>
      <stop offset="0.45" stop-color="#FFD666"/>
      <stop offset="1" stop-color="#FFA01B"/>
